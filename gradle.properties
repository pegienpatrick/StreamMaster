# AGP 8: keep R ids final so `case R.id.x:` in MainActivity keeps compiling
android.nonFinalResIds=false
# legacy project: single R class per module (old code assumes it)
android.nonTransitiveRClass=false
# AndroidX (migrated from the v26 support library)
android.useAndroidX=true
android.enableJetifier=false

org.gradle.jvmargs=-Xmx2g
